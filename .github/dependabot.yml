version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # Keep types aligned with the Node 22 runtime used by CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
