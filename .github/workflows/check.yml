name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests
      - name: Check installer syntax and both image paths
        run: |
          bash -n install.sh
          python3 scripts/checks/install-check.py
          INSTALL_CHECK_USE_LOCAL_IMAGE=0 python3 scripts/checks/install-check.py

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
